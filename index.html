<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pintagua</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #f2f2f2;
      color: #222;
    }

    /* BARRA SUPERIOR */
    .top-bar {
      background-color: #f2f2f2;
      height: 100px;
      display: flex;
      align-items: center;
      padding: 0 30px;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid #ddd;
    }

    .top-bar img {
      height: 70px;
    }

    .nav-links {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: center;
    }

    .nav-links a {
      text-decoration: none;
      color: #000;
      font-weight: 500;
    }

    .nav-links a:hover {
      color: #facc15;
    }

    .separator {
      color: #999;
      cursor: default;
      user-select: none;
    }

    /* HERO */
    .hero {
      position: relative;
      height: 70vh;
      background-image: url("img/fondo.jpg");
      background-size: cover;
      background-position: center;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
    }

    .hero-content {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
    }

    /* CONTENIDO */
    .content {
      max-width: 900px;
      margin: 40px auto;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      scroll-margin-top: 120px;
    }

    /* PAGINA JUEGO */
    .game-page {
      min-height: 100vh;
      background: #ffffff;
      padding: 120px 20px 40px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game-box {
      max-width: 500px;
      width: 100%;
      background: #f9f9f9;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      text-align: center;
    }

    .game-box button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      background: #e5e5e5;
      cursor: pointer;
    }

    .game-box button:hover {
      background: #facc15;
    }

    html {
      scroll-behavior: smooth;
    }
  </style>
</head>

<body>

  <!-- BARRA -->
  <div class="top-bar">
    <img src="img/logo.png" alt="Logo">

    <div class="nav-links">
      <a href="#inicio">Inicio</a>
      <a href="#problema">Problema</a>
      <a href="#marco">Marco teórico</a>
      <a href="#impacto">Impacto marino</a>
      <a href="#personas">Impacto humano</a>
      <a href="#soluciones">Soluciones</a>

      <span class="separator">|</span>

      <a href="#pagina-juego">Juego</a>
    </div>
  </div>

  <!-- HERO -->
  <section class="hero" id="inicio">
    <div class="hero-content">
      <h1>La basura en los ecosistemas marinos</h1>
    </div>
  </section>

  <!-- CONTENIDO -->
  <div class="content">
    <div class="card" id="problema"><h3>Problema</h3></div>
    <div class="card" id="marco"><h3>Marco teórico</h3></div>
    <div class="card" id="impacto"><h3>Impacto marino</h3></div>
    <div class="card" id="personas"><h3>Impacto humano</h3></div>
    <div class="card" id="soluciones"><h3>Soluciones</h3></div>
  </div>

  <!-- PAGINA DEL JUEGO -->
  <section class="game-page" id="pagina-juego">
    <div class="game-box">
      <h2>Juego educativo</h2>
      <p>¿Qué residuo contamina más el océano?</p>

      <button onclick="res(false)">Vidrio</button>
      <button onclick="res(true)">Plástico</button>
      <button onclick="res(false)">Papel</button>

      <p id="res"></p>
    </div>
  </section>

  <script>
    function res(ok) {
      const r = document.getElementById("res");
      r.textContent = ok ? "✅ Correcto" : "❌ Incorrecto";
      r.style.color = ok ? "green" : "red";
    }
  </script>

</body>
</html>
